<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>骑行318 - 轻轨穿楼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #424242 0%, #212121 100%);
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        
        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @keyframes modalSlideIn {
            from { opacity: 0; transform: scale(0.8) translateY(50px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        @keyframes buildingScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        @keyframes lightRailMove {
            0% { left: -100px; }
            100% { left: calc(100% + 100px); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: fadeInDown 0.4s ease-out;
            color: white;
        }

        .back-btn, .pause-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .back-btn:hover, .pause-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            animation: fadeInDown 0.5s ease-out 0.1s forwards;
            opacity: 0;
        }

        .game-area {
            position: relative;
            width: 100%;
            height: calc(100vh - 180px);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        .building {
            position: absolute;
            bottom: 0;
            width: 80px;
            background: linear-gradient(180deg, #616161 0%, #424242 100%);
            border-radius: 8px 8px 0 0;
            animation: buildingScroll 3s linear infinite;
        }

        .building:nth-child(1) { height: 200px; left: 10%; animation-delay: 0s; }
        .building:nth-child(2) { height: 300px; left: 30%; animation-delay: 0.5s; }
        .building:nth-child(3) { height: 250px; left: 50%; animation-delay: 1s; }
        .building:nth-child(4) { height: 350px; left: 70%; animation-delay: 1.5s; }

        .building::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            right: 20%;
            bottom: 10%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 15px,
                rgba(255, 255, 255, 0.3) 15px,
                rgba(255, 255, 255, 0.3) 17px
            );
        }

        .light-rail {
            position: absolute;
            top: 40%;
            font-size: 48px;
            animation: lightRailMove 2s linear infinite;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .obstacle {
            position: absolute;
            font-size: 40px;
            z-index: 5;
        }

        .score-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            border-radius: 20px;
            animation: fadeInDown 0.5s ease-out 0.3s forwards;
            opacity: 0;
        }

        .score {
            font-size: 48px;
            font-weight: 700;
            color: #FFC107;
            margin-bottom: 8px;
        }

        .timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 32px;
            font-weight: 700;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 16px;
            animation: fadeInDown 0.5s ease-out 0.4s forwards;
            opacity: 0;
        }

        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.6s ease-out 0.8s forwards;
            opacity: 0;
        }

        .control-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFC107 0%, #FFD54F 100%);
            color: #212121;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #212121 0%, #424242 100%);
            border-radius: 24px;
            padding: 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            border: 2px solid rgba(255, 193, 7, 0.3);
            animation: modalSlideIn 0.4s ease-out;
        }

        .modal-icon {
            font-size: 72px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            color: #FFC107;
            margin-bottom: 12px;
        }

        .modal-score {
            font-size: 48px;
            font-weight: 700;
            color: white;
            margin: 20px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="game-title">🚇 轻轨穿楼</div>
        <button class="pause-btn" onclick="togglePause()">⏸️</button>
    </div>

    <div class="game-area" id="game-area">
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>

        <div class="light-rail" id="light-rail">🚇</div>
    </div>

    <div class="score-panel">
        <div class="score" id="score">0</div>
    </div>

    <div class="timer" id="timer">60</div>

    <div class="bottom-controls">
        <button class="control-btn btn-secondary" onclick="goBack()">退出</button>
        <button class="control-btn btn-primary" id="start-btn" onclick="startGame()">开始游戏</button>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <div class="modal-title">游戏结束！</div>
            <div class="modal-score" id="final-score">0</div>
            <div class="modal-buttons">
                <button class="control-btn btn-secondary" onclick="retryGame()">重试</button>
                <button class="control-btn btn-primary" onclick="continueRiding()">继续骑行</button>
            </div>
        </div>
    </div>

    <script>
        let gameStarted = false;
        let gamePaused = false;
        let score = 0;
        let timeLeft = 60;
        let timerInterval;
        let obstacleInterval;

        function startGame() {
            if (gameStarted) return;
            
            gameStarted = true;
            score = 0;
            timeLeft = 60;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '60';
            document.getElementById('start-btn').textContent = '游戏中...';
            document.getElementById('start-btn').disabled = true;
            
            // 生成障碍物
            obstacleInterval = setInterval(() => {
                if (!gamePaused) {
                    createObstacle();
                }
            }, 1500);
            
            // 计时器
            timerInterval = setInterval(() => {
                if (!gamePaused) {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }
            }, 1000);
        }

        function createObstacle() {
            const gameArea = document.getElementById('game-area');
            const obstacle = document.createElement('div');
            obstacle.className = 'obstacle';
            obstacle.textContent = Math.random() > 0.5 ? '🏢' : '🏗️';
            obstacle.style.left = Math.random() * (window.innerWidth - 60) + 30 + 'px';
            obstacle.style.top = '-60px';
            obstacle.style.animation = 'fall 3s linear forwards';
            
            gameArea.appendChild(obstacle);
            
            setTimeout(() => {
                if (obstacle.parentNode) {
                    obstacle.remove();
                }
            }, 3000);
        }

        function endGame() {
            gameStarted = false;
            clearInterval(obstacleInterval);
            clearInterval(timerInterval);
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('result-modal').classList.add('active');
            document.getElementById('start-btn').textContent = '开始游戏';
            document.getElementById('start-btn').disabled = false;
        }

        function togglePause() {
            if (!gameStarted) return;
            gamePaused = !gamePaused;
            document.querySelector('.pause-btn').textContent = gamePaused ? '▶️' : '⏸️';
        }

        function retryGame() {
            document.getElementById('result-modal').classList.remove('active');
            startGame();
        }

        function continueRiding() {
            alert('获得奖励：850能量！\n解锁成就：山城骑士');
            window.location.href = 'prototype_main.html';
        }

        function goBack() {
            if (gameStarted) {
                if (confirm('确定要退出游戏吗？当前进度将丢失。')) {
                    window.location.href = 'prototype_main.html';
                }
            } else {
                window.location.href = 'prototype_main.html';
            }
        }

        // 左右滑动控制
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });
        
        document.addEventListener('touchmove', (e) => {
            if (!gameStarted || gamePaused) return;
            
            const touchX = e.touches[0].clientX;
            const diff = touchX - touchStartX;
            const rail = document.getElementById('light-rail');
            
            if (Math.abs(diff) > 30) {
                const left = parseInt(rail.style.left) || 0;
                rail.style.left = Math.max(0, Math.min(window.innerWidth - 60, left + diff)) + 'px';
                touchStartX = touchX;
            }
        });

        // 键盘控制（调试用）
        document.addEventListener('keydown', (e) => {
            if (!gameStarted || gamePaused) return;
            
            const rail = document.getElementById('light-rail');
            let left = parseInt(rail.style.left) || 0;
            
            if (e.key === 'ArrowLeft') {
                rail.style.left = Math.max(0, left - 30) + 'px';
            } else if (e.key === 'ArrowRight') {
                rail.style.left = Math.min(window.innerWidth - 60, left + 30) + 'px';
            }
        });
    </script>
</body>
</html>
