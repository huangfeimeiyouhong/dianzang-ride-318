<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>骑行318 - 光影捕捉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #FFF8E1 0%, #FFE082 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes lightShimmer {
            0% { opacity: 0.3; transform: scale(1) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
            100% { opacity: 0.3; transform: scale(1) rotate(360deg); }
        }
        
        @keyframes photoFlash {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            animation: fadeInDown 0.4s ease-out;
        }

        .back-btn, .pause-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #F5F5F5;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            animation: fadeInDown 0.5s ease-out 0.1s forwards;
            opacity: 0;
        }

        .game-area {
            position: relative;
            width: 100%;
            height: calc(100vh - 180px);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        /* 光线效果 */
        .light-spot {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, transparent 70%);
            cursor: pointer;
            animation: lightShimmer 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.8));
        }

        .light-spot.captured {
            animation: photoFlash 0.5s ease-out forwards;
        }

        /* 取景框 */
        .viewfinder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 180px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.3);
        }

        .viewfinder::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        /* 分数面板 */
        .score-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            animation: fadeInDown 0.5s ease-out 0.3s forwards;
            opacity: 0;
        }

        .score {
            font-size: 48px;
            font-weight: 700;
            color: #FF8F00;
            margin-bottom: 8px;
        }

        .photo-count {
            font-size: 20px;
            color: #666;
            font-weight: 600;
        }

        /* 计时器 */
        .timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            z-index: 20;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 16px;
            animation: fadeInDown 0.5s ease-out 0.4s forwards;
            opacity: 0;
        }

        /* 底部按钮 */
        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
            animation: fadeInUp 0.6s ease-out 0.8s forwards;
            opacity: 0;
        }

        .control-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF8F00 0%, #FFB300 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 143, 0, 0.4);
        }

        .btn-secondary {
            background: #F5F5F5;
            color: #666;
        }

        /* 游戏结束弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
        }

        .modal-icon {
            font-size: 72px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .modal-score {
            font-size: 48px;
            font-weight: 700;
            color: #FF8F00;
            margin: 20px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="game-title">📷 光影捕捉</div>
        <button class="pause-btn" onclick="togglePause()">⏸️</button>
    </div>

    <div class="game-area" id="game-area">
        <div class="viewfinder"></div>
    </div>

    <div class="score-panel">
        <div class="score" id="score">0</div>
        <div class="photo-count" id="photo-count">照片: 0/10</div>
    </div>

    <div class="timer" id="timer">30</div>

    <div class="bottom-controls">
        <button class="control-btn btn-secondary" onclick="goBack()">退出</button>
        <button class="control-btn btn-primary" id="start-btn" onclick="startGame()">开始游戏</button>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <div class="modal-title">游戏结束！</div>
            <div class="modal-score" id="final-score">0</div>
            <div class="modal-buttons">
                <button class="control-btn btn-secondary" onclick="retryGame()">重试</button>
                <button class="control-btn btn-primary" onclick="continueRiding()">继续骑行</button>
            </div>
        </div>
    </div>

    <script>
        let gameStarted = false;
        let gamePaused = false;
        let score = 0;
        let photos = 0;
        let timeLeft = 30;
        let timerInterval;
        let lightInterval;

        function startGame() {
            if (gameStarted) return;
            
            gameStarted = true;
            score = 0;
            photos = 0;
            timeLeft = 30;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('photo-count').textContent = '照片: 0/10';
            document.getElementById('timer').textContent = '30';
            document.getElementById('start-btn').textContent = '游戏中...';
            document.getElementById('start-btn').disabled = true;
            
            // 生成光线
            lightInterval = setInterval(() => {
                if (!gamePaused) {
                    createLight();
                }
            }, 1000);
            
            // 计时器
            timerInterval = setInterval(() => {
                if (!gamePaused) {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    
                    if (timeLeft <= 0 || photos >= 10) {
                        endGame();
                    }
                }
            }, 1000);
        }

        function createLight() {
            const gameArea = document.getElementById('game-area');
            const light = document.createElement('div');
            light.className = 'light-spot';
            light.style.left = Math.random() * (window.innerWidth - 100) + 50 + 'px';
            light.style.top = Math.random() * (window.innerHeight - 200) + 100 + 'px';
            
            light.addEventListener('click', (e) => {
                e.stopPropagation();
                captureLight(light);
            });
            
            gameArea.appendChild(light);
            
            setTimeout(() => {
                if (light.parentNode && !light.classList.contains('captured')) {
                    light.remove();
                }
            }, 2000);
        }

        function captureLight(light) {
            if (light.classList.contains('captured')) return;
            
            light.classList.add('captured');
            photos++;
            score += 100;
            
            document.getElementById('score').textContent = Math.floor(score);
            document.getElementById('photo-count').textContent = `照片: ${photos}/10`;
            
            setTimeout(() => {
                light.remove();
            }, 500);
            
            if (photos >= 10) {
                setTimeout(() => endGame(), 500);
            }
        }

        function endGame() {
            gameStarted = false;
            clearInterval(lightInterval);
            clearInterval(timerInterval);
            
            document.getElementById('final-score').textContent = Math.floor(score);
            document.getElementById('result-modal').classList.add('active');
            document.getElementById('start-btn').textContent = '开始游戏';
            document.getElementById('start-btn').disabled = false;
        }

        function togglePause() {
            if (!gameStarted) return;
            gamePaused = !gamePaused;
            document.querySelector('.pause-btn').textContent = gamePaused ? '▶️' : '⏸️';
        }

        function retryGame() {
            document.getElementById('result-modal').classList.remove('active');
            const lights = document.querySelectorAll('.light-spot');
            lights.forEach(light => light.remove());
            startGame();
        }

        function continueRiding() {
            alert('获得奖励：950能量！\n解锁成就：光影视界');
            window.location.href = 'prototype_main.html';
        }

        function goBack() {
            if (gameStarted) {
                if (confirm('确定要退出游戏吗？当前进度将丢失。')) {
                    window.location.href = 'prototype_main.html';
                }
            } else {
                window.location.href = 'prototype_main.html';
            }
        }
    </script>
</body>
</html>
