<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>骑行318 - 茶马古道</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #E8F5E9 0%, #A5D6A7 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes balance {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-10deg); }
            75% { transform: translateX(-50%) rotate(10deg); }
        }
        
        @keyframes teaBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            animation: fadeInDown 0.4s ease-out;
        }

        .back-btn, .pause-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #F5F5F5;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover, .pause-btn:hover {
            background: #E0E0E0;
            transform: scale(1.1);
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            animation: fadeInDown 0.5s ease-out 0.1s forwards;
            opacity: 0;
        }

        .game-area {
            position: relative;
            width: 100%;
            height: calc(100vh - 180px);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        /* 山地背景 */
        .mountain {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 300px solid #4CAF50;
            opacity: 0.3;
        }

        .mountain:nth-child(1) { left: 5%; }
        .mountain:nth-child(2) { left: 30%; border-bottom-color: #388E3C; }
        .mountain:nth-child(3) { left: 60%; border-bottom-color: #66BB6A; }

        /* 背夫 */
        .carrier {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 64px;
            animation: balance 2s ease-in-out infinite, fadeInUp 0.8s ease-out 0.5s forwards;
            opacity: 0;
        }

        /* 负重条 */
        .load-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            z-index: 10;
            animation: fadeInDown 0.5s ease-out 0.3s forwards;
            opacity: 0;
        }

        .load-fill {
            height: 30px;
            background: linear-gradient(90deg, #4CAF50 0%, #FFC107 50%, #F44336 100%);
            border-radius: 15px;
            transition: width 0.3s ease;
            position: relative;
        }

        .load-text {
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }

        /* 茶叶收集 */
        .tea-leaf {
            position: absolute;
            font-size: 36px;
            cursor: pointer;
            animation: teaBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        /* 分数面板 */
        .score-panel {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            animation: fadeInDown 0.5s ease-out 0.4s forwards;
            opacity: 0;
        }

        .score {
            font-size: 48px;
            font-weight: 700;
            color: #4CAF50;
        }

        /* 计时器 */
        .timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 16px;
            animation: fadeInDown 0.5s ease-out 0.4s forwards;
            opacity: 0;
        }

        /* 底部按钮 */
        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
            animation: fadeInUp 0.6s ease-out 0.8s forwards;
            opacity: 0;
        }

        .control-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #81C784 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }

        .btn-secondary {
            background: #F5F5F5;
            color: #666;
        }

        /* 游戏结束弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
        }

        .modal-icon {
            font-size: 72px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .modal-score {
            font-size: 48px;
            font-weight: 700;
            color: #4CAF50;
            margin: 20px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="game-title">🍵 茶马古道</div>
        <button class="pause-btn" onclick="togglePause()">⏸️</button>
    </div>

    <div class="game-area" id="game-area">
        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>

        <div class="carrier">🚶</div>

        <div class="load-bar">
            <div class="load-fill" id="load-fill" style="width: 50%;"></div>
            <div class="load-text" id="load-text">负重：50%</div>
        </div>

        <div class="score-panel">
            <div class="score" id="score">0</div>
        </div>

        <div class="timer" id="timer">90</div>
    </div>

    <div class="bottom-controls">
        <button class="control-btn btn-secondary" onclick="goBack()">退出</button>
        <button class="control-btn btn-primary" id="start-btn" onclick="startGame()">开始游戏</button>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <div class="modal-title">游戏结束！</div>
            <div class="modal-score" id="final-score">0</div>
            <div class="modal-buttons">
                <button class="control-btn btn-secondary" onclick="retryGame()">重试</button>
                <button class="control-btn btn-primary" onclick="continueRiding()">继续骑行</button>
            </div>
        </div>
    </div>

    <script>
        let gameStarted = false;
        let gamePaused = false;
        let score = 0;
        let timeLeft = 90;
        let loadLevel = 50;
        let teaCount = 0;
        let timerInterval;
        let teaInterval;

        function startGame() {
            if (gameStarted) return;
            
            gameStarted = true;
            score = 0;
            timeLeft = 90;
            loadLevel = 50;
            teaCount = 0;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '90';
            document.getElementById('load-fill').style.width = '50%';
            document.getElementById('load-text').textContent = '负重：50%';
            document.getElementById('start-btn').textContent = '游戏中...';
            document.getElementById('start-btn').disabled = true;
            
            // 生成茶叶
            teaInterval = setInterval(() => {
                if (!gamePaused) {
                    createTea();
                }
            }, 1500);
            
            // 负重自然增加
            setInterval(() => {
                if (!gamePaused && gameStarted) {
                    loadLevel = Math.min(100, loadLevel + 2);
                    updateLoad();
                }
            }, 2000);
            
            // 计时器
            timerInterval = setInterval(() => {
                if (!gamePaused) {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    
                    if (timeLeft <= 0 || loadLevel >= 100) {
                        endGame();
                    }
                }
            }, 1000);
        }

        function createTea() {
            const gameArea = document.getElementById('game-area');
            const tea = document.createElement('div');
            tea.className = 'tea-leaf';
            tea.textContent = '🍵';
            tea.style.left = Math.random() * (window.innerWidth - 60) + 30 + 'px';
            tea.style.top = Math.random() * (window.innerHeight - 300) + 150 + 'px';
            
            tea.addEventListener('click', (e) => {
                e.stopPropagation();
                collectTea(tea);
            });
            
            gameArea.appendChild(tea);
            
            setTimeout(() => {
                if (tea.parentNode) {
                    tea.remove();
                }
            }, 3000);
        }

        function collectTea(tea) {
            tea.remove();
            teaCount++;
            score += 100;
            loadLevel = Math.min(100, loadLevel + 5);
            updateLoad();
            updateScore();
            
            if (teaCount >= 20) {
                endGame(true);
            }
        }

        function updateLoad() {
            document.getElementById('load-fill').style.width = loadLevel + '%';
            document.getElementById('load-text').textContent = `负重：${loadLevel}%`;
        }

        function updateScore() {
            document.getElementById('score').textContent = Math.floor(score);
        }

        function endGame(success = false) {
            gameStarted = false;
            clearInterval(teaInterval);
            clearInterval(timerInterval);
            
            document.getElementById('final-score').textContent = Math.floor(score);
            document.getElementById('result-modal').classList.add('active');
            document.getElementById('start-btn').textContent = '开始游戏';
            document.getElementById('start-btn').disabled = false;
        }

        function togglePause() {
            if (!gameStarted) return;
            gamePaused = !gamePaused;
            document.querySelector('.pause-btn').textContent = gamePaused ? '▶️' : '⏸️';
        }

        function retryGame() {
            document.getElementById('result-modal').classList.remove('active');
            const teas = document.querySelectorAll('.tea-leaf');
            teas.forEach(tea => tea.remove());
            startGame();
        }

        function continueRiding() {
            alert('获得奖励：900能量！\n解锁成就：背夫传奇');
            window.location.href = 'prototype_main.html';
        }

        function goBack() {
            if (gameStarted) {
                if (confirm('确定要退出游戏吗？当前进度将丢失。')) {
                    window.location.href = 'prototype_main.html';
                }
            } else {
                window.location.href = 'prototype_main.html';
            }
        }

        // 倾斜控制（设备方向）
        window.addEventListener('deviceorientation', (e) => {
            if (!gameStarted || gamePaused) return;
            
            const beta = e.beta; // 前后倾斜
            if (beta > 10) {
                // 向前倾斜，减重
                loadLevel = Math.max(0, loadLevel - 1);
                updateLoad();
            }
        });
    </script>
</body>
</html>
