<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>骑行318 - 屈原投江</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #E3F2FD 0%, #42A5F5 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* ===== 动画关键帧 ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        
        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @keyframes modalSlideIn {
            from { opacity: 0; transform: scale(0.8) translateY(50px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        @keyframes boatFloat {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            25% { transform: translateX(-50%) translateY(-5px) rotate(-2deg); }
            75% { transform: translateX(-50%) translateY(5px) rotate(2deg); }
        }
        
        @keyframes rockMove {
            0% { transform: translateX(0); }
            50% { transform: translateX(-100px); }
            100% { transform: translateX(-200px); }
        }
        
        @keyframes fragmentFall {
            0% {
                top: -60px;
                opacity: 1;
                transform: rotate(0deg);
            }
            100% {
                top: calc(100% - 150px);
                opacity: 0.8;
                transform: rotate(360deg);
            }
        }

        /* 顶部栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            animation: fadeInDown 0.4s ease-out;
        }

        .back-btn, .pause-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #F5F5F5;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .back-btn:hover, .pause-btn:hover {
            background: #E0E0E0;
            transform: scale(1.1);
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            animation: fadeInDown 0.5s ease-out 0.1s forwards;
            opacity: 0;
        }

        /* 游戏区域 */
        .game-area {
            position: relative;
            width: 100%;
            height: calc(100vh - 180px);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        /* 河流背景 */
        .river {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(180deg, #42A5F5 0%, #1976D2 100%);
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }

        /* 暗礁 */
        .rock {
            position: absolute;
            bottom: 100px;
            font-size: 48px;
            animation: rockMove 3s linear infinite;
            z-index: 5;
        }

        /* 船 */
        .boat {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 64px;
            cursor: pointer;
            animation: boatFloat 2s ease-in-out infinite;
            z-index: 10;
            transition: bottom 0.3s ease;
        }

        /* 离骚碎片 */
        .fragment {
            position: absolute;
            font-size: 36px;
            cursor: pointer;
            animation: fragmentFall 4s linear forwards;
            z-index: 8;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .fragment.caught {
            animation: fragmentCaught 0.5s ease-out forwards;
        }

        @keyframes fragmentCaught {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* 分数面板 */
        .score-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            animation: fadeInDown 0.5s ease-out 0.3s forwards;
            opacity: 0;
        }

        .score {
            font-size: 48px;
            font-weight: 700;
            color: #1976D2;
            margin-bottom: 8px;
            transition: transform 0.3s ease;
        }

        .fragment-count {
            font-size: 20px;
            color: #FF6B35;
            font-weight: 600;
        }

        /* 计时器 */
        .timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            z-index: 20;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 16px;
            animation: fadeInDown 0.5s ease-out 0.4s forwards;
            opacity: 0;
        }

        /* 底部按钮 */
        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
            animation: fadeInUp 0.6s ease-out 0.8s forwards;
            opacity: 0;
        }

        .control-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1976D2 0%, #42A5F5 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.4);
        }

        .btn-secondary {
            background: #F5F5F5;
            color: #666;
        }

        /* 游戏结束弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            animation: modalSlideIn 0.4s ease-out;
        }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="game-title">🛶 屈原投江</div>
        <button class="pause-btn" onclick="togglePause()">⏸️</button>
    </div>

    <!-- 游戏区域 -->
    <div class="game-area" id="game-area">
        <!-- 河流 -->
        <div class="river"></div>
    </div>

    <!-- 分数面板 -->
    <div class="score-panel">
        <div class="score" id="score">0</div>
        <div class="fragment-count" id="fragment-count">碎片: 0/5</div>
    </div>

    <!-- 计时器 -->
    <div class="timer" id="timer">90</div>

    <!-- 底部控制 -->
    <div class="bottom-controls">
        <button class="control-btn btn-secondary" onclick="goBack()">退出</button>
        <button class="control-btn btn-primary" id="start-btn" onclick="startGame()">开始游戏</button>
    </div>

    <!-- 游戏结束弹窗 -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <div class="modal-title">游戏结束！</div>
            <div class="modal-score" id="final-score">0</div>
            <div class="modal-buttons">
                <button class="control-btn btn-secondary" onclick="retryGame()">重试</button>
                <button class="control-btn btn-primary" onclick="continueRiding()">继续骑行</button>
            </div>
        </div>
    </div>

    <script>
        let gameStarted = false;
        let gamePaused = false;
        let score = 0;
        let fragments = 0;
        let timeLeft = 90;
        let timerInterval;
        let spawnInterval;

        function startGame() {
            if (gameStarted) return;
            
            gameStarted = true;
            score = 0;
            fragments = 0;
            timeLeft = 90;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('fragment-count').textContent = '碎片: 0/5';
            document.getElementById('timer').textContent = '90';
            document.getElementById('start-btn').textContent = '游戏中...';
            document.getElementById('start-btn').disabled = true;
            
            // 创建船
            const gameArea = document.getElementById('game-area');
            const boat = document.createElement('div');
            boat.className = 'boat';
            boat.id = 'boat';
            boat.textContent = '🛶';
            boat.onclick = () => moveBoatUp();
            gameArea.appendChild(boat);
            
            // 生成暗礁和碎片
            spawnInterval = setInterval(() => {
                if (!gamePaused) {
                    createRock();
                    if (fragments < 5 && Math.random() < 0.5) {
                        createFragment();
                    }
                }
            }, 2000);
            
            // 计时器
            timerInterval = setInterval(() => {
                if (!gamePaused) {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    
                    if (timeLeft <= 0 || fragments >= 5) {
                        endGame();
                    }
                }
            }, 1000);
        }

        function createRock() {
            const gameArea = document.getElementById('game-area');
            const rock = document.createElement('div');
            rock.className = 'rock';
            rock.textContent = '🪨';
            rock.style.left = Math.random() * (window.innerWidth - 60) + 30 + 'px';
            rock.style.animationDuration = '3s';
            
            gameArea.appendChild(rock);
            
            setTimeout(() => {
                if (rock.parentNode) {
                    rock.remove();
                }
            }, 3000);
        }

        function createFragment() {
            const gameArea = document.getElementById('game-area');
            const fragment = document.createElement('div');
            fragment.className = 'fragment';
            fragment.textContent = '📜';
            fragment.style.left = Math.random() * (window.innerWidth - 60) + 30 + 'px';
            fragment.style.top = '-60px';
            
            fragment.onclick = (e) => {
                e.stopPropagation();
                catchFragment(fragment);
            };
            
            gameArea.appendChild(fragment);
            
            setTimeout(() => {
                if (fragment.parentNode && !fragment.classList.contains('caught')) {
                    fragment.remove();
                }
            }, 4000);
        }

        function catchFragment(fragment) {
            if (fragment.classList.contains('caught')) return;
            
            fragment.classList.add('caught');
            fragments++;
            score += 200;
            
            document.getElementById('score').textContent = score;
            document.getElementById('fragment-count').textContent = `碎片: ${fragments}/5`;
            
            setTimeout(() => { fragment.remove(); }, 500);
            
            if (fragments >= 5) {
                setTimeout(() => endGame(), 500);
            }
        }

        function moveBoatUp() {
            if (!gameStarted || gamePaused) return;
            
            const boat = document.getElementById('boat');
            let bottom = parseInt(boat.style.bottom) || 120;
            bottom += 30;
            if (bottom > 300) bottom = 300;
            boat.style.bottom = bottom + 'px';
        }

        function endGame() {
            gameStarted = false;
            clearInterval(spawnInterval);
            clearInterval(timerInterval);
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('result-modal').classList.add('active');
            document.getElementById('start-btn').textContent = '开始游戏';
            document.getElementById('start-btn').disabled = false;
        }

        function togglePause() {
            if (!gameStarted) return;
            gamePaused = !gamePaused;
            document.querySelector('.pause-btn').textContent = gamePaused ? '▶️' : '⏸️';
        }

        function retryGame() {
            document.getElementById('result-modal').classList.remove('active');
            const boat = document.getElementById('boat');
            if (boat) boat.remove();
            startGame();
        }

        function continueRiding() {
            alert('获得奖励：800能量！\n解锁成就：楚辞传人');
            window.location.href = 'prototype_main.html';
        }

        function goBack() {
            if (gameStarted) {
                if (confirm('确定要退出游戏吗？当前进度将丢失。')) {
                    window.location.href = 'prototype_main.html';
                }
            } else {
                window.location.href = 'prototype_main.html';
            }
        }

        // 触摸控制（上滑移动船）
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchmove', (e) => {
            if (!gameStarted || gamePaused) return;
            
            const touchY = e.touches[0].clientY;
            const diff = touchStartY - touchY;
            
            if (diff > 50) {
                moveBoatUp();
                touchStartY = touchY;
            }
        });
    </script>
</body>
</html>
